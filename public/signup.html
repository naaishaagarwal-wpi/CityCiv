<!DOCTYPE html>
<!-- Login page for initial user authentication and account access -->
<html>
<head>
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
</head>

<body class="index-body">
<h1>CityCiv</h1>
<!-- Signup/Login Form for user authentication -->
<h2>Signup/Login</h2>
<div class="login-container">
    <input class="login-input" type="email" id="email" placeholder="Email" />
    <input class="login-input" type="password" id="password" placeholder="Password" />
    <input class="login-input" type="text" id="username" placeholder="Username" />
    <input class="login-input" type="text" id="full_name" placeholder="Full Name" />

    <button class="login-button" id="signup">Sign Up</button>
</div>
<p id="message"></p>

<script type="module" src="login.js"></script>

</body>
</html>
